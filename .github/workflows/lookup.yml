name: lookup
on: workflow_dispatch
permissions:
  contents: write
jobs:
  l:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY' > out.txt
          import json,urllib.request,urllib.parse,re
          def q(cat):
              u="https://commons.wikimedia.org/w/api.php?"+urllib.parse.urlencode({"action":"query","generator":"categorymembers","gcmtitle":cat,"gcmtype":"file","gcmlimit":"80","prop":"imageinfo","iiprop":"url|size|extmetadata","iiextmetadatafilter":"Artist|LicenseShortName|ImageDescription|DateTimeOriginal","format":"json"})
              d=json.load(urllib.request.urlopen(urllib.request.Request(u,headers={"User-Agent":"KvalitaMista/1.0 (jirka.luke3@gmail.com)"})))
              print("==",cat)
              for p in d.get("query",{}).get("pages",{}).values():
                  i=p["imageinfo"][0];m=i.get("extmetadata",{})
                  g=lambda k:re.sub("<[^>]+>","",m.get(k,{}).get("value","")).strip()[:90]
                  print(p["title"],"|",i["width"],"x",i["height"],"|",g("Artist"),"|",g("LicenseShortName"),"|",g("ImageDescription"),"|",i["url"])
          def get(params):
              u="https://commons.wikimedia.org/w/api.php?"+urllib.parse.urlencode(dict(params,format="json"))
              return json.load(urllib.request.urlopen(urllib.request.Request(u,headers={"User-Agent":"KvalitaMista/1.0 (jirka.luke3@gmail.com)"})))
          for t in ["Unité d'habitation","Le Corbusier"]:
              d=get({"action":"query","list":"categorymembers","cmtitle":"Category:"+t,"cmtype":"subcat","cmlimit":"100"})
              print("SUBCATS",t,[c["title"] for c in d["query"]["categorymembers"]])
          d=get({"action":"query","list":"search","srsearch":"Unité d'habitation","srnamespace":"14","srlimit":"30"})
          print("CATSEARCH",[c["title"] for c in d["query"]["search"]])
          for c in [x["title"] for x in d["query"]["search"]][:12]:
              try: q(c)
              except Exception as e: print("ERR",c,e)
          PY
          git init -q r && cd r && mv ../out.txt . && git add out.txt && git -c user.name=bot -c user.email=b@b commit -qm out && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/tmp-lookup
